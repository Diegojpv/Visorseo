<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>visorseo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <!-- Encabezado -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <h1 class="font-poppins">visorseo</h1>
      </div>
      <span class="badge" id="status-badge">Listo</span>
    </header>

    <!-- Dominio -->
    <section class="domain-container">
      <span class="label">Dominio actual:</span>
      <p class="domain-name" id="current-domain">Detectando...</p>
    </section>

    <!-- Navegación por Pestañas -->
    <nav class="tabs-nav font-poppins">
      <button class="tab-btn active" data-tab="tab-autoridad">Autoridad</button>
      <button class="tab-btn" data-tab="tab-enlaces">Enlaces</button>
      <button class="tab-btn" data-tab="tab-trafico">Tráfico</button>
      <button class="tab-btn" data-tab="tab-riesgo">Riesgo</button>
      <button class="tab-btn" data-tab="tab-rendimiento">Rendimiento</button>
    </nav>

    <!-- PESTAÑA 1: AUTORIDAD -->
    <div class="tab-content active" id="tab-autoridad">
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">Domain Authority</span>
          <span class="metric-value" id="da-val">--</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Page Authority</span>
          <span class="metric-value" id="pa-val">--</span>
        </div>
        <div class="metric-card full-width">
          <span class="metric-label">Domain Rating (DR)</span>
          <span class="metric-value" id="dr-val">--</span>
        </div>
      </div>
    </div>

    <!-- PESTAÑA 2: ENLACES -->
    <div class="tab-content" id="tab-enlaces">
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">Total Backlinks</span>
          <span class="metric-value" id="backlinks-val">--</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Ref. Domains</span>
          <span class="metric-value" id="ref-domains-val">--</span>
        </div>
      </div>
    </div>

    <!-- PESTAÑA 3: TRÁFICO -->
    <div class="tab-content" id="tab-trafico">
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">Tráfico Orgánico</span>
          <span class="metric-value" id="traffic-val">--</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Palabras Clave</span>
          <span class="metric-value" id="keywords-val">--</span>
        </div>
      </div>
    </div>

    <!-- PESTAÑA 4: RIESGO -->
    <div class="tab-content" id="tab-riesgo">
      <div class="metrics-grid">
        <div class="metric-card full-width">
          <span class="metric-label">Spam Score (Moz)</span>
          <span class="metric-value" id="spam-val">--%</span>
        </div>
      </div>
    </div>

    <!-- PESTAÑA 5: RENDIMIENTO -->
    <div class="tab-content" id="tab-rendimiento">
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">Rendimiento Web</span>
          <span class="metric-value" id="speed-val">--</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">SEO On-Page</span>
          <span class="metric-value" id="onpage-val">--</span>
        </div>
      </div>
    </div>

    <!-- Botón -->
    <button id="btn-analyze" class="btn-primary font-poppins">
      Analizar Dominio
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
