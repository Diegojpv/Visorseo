<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor SEO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <!-- Encabezado con tu Logo en Imagen y tipografía ajustada -->
    <header class="header">
      <div class="brand">
        <!-- Reemplaza "logo.png" por el nombre de tu imagen -->
        <img src="visorseo-logo.webp" alt="Logo" class="logo-img">
        <h1 class="font-poppins logo-text"><strong>VISOR</strong>SEO</h1>
      </div>
      <span class="badge badge-neutral" id="status-badge">Listo</span>
    </header>

    <!-- Caja de Dominio Dinámica -->
    <section class="domain-container">
      <span class="label">Analizando objetivo:</span>
      <p class="domain-name" id="current-domain">Detectando...</p>
    </section>

    <!-- Navegación con Iconos (Icono de Riesgo corregido) -->
    <nav class="tabs-nav font-poppins">
      <button class="tab-btn active" data-tab="tab-autoridad">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"></path><path d="M18 20V4"></path><path d="M6 20v-4"></path></svg>
        Autoridad
      </button>
      <button class="tab-btn" data-tab="tab-enlaces">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        Enlaces
      </button>
      <button class="tab-btn" data-tab="tab-trafico">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        Tráfico
      </button>
      <button class="tab-btn" data-tab="tab-riesgo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><circle cx="12" cy="17.5" r="1" fill="currentColor"></circle></svg>
        Riesgo
      </button>
    </nav>

    <!-- CONTENEDORES DE MÉTRICAS (Con puntos indicadores) -->
    <div class="tab-content active" id="tab-autoridad">
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">Domain Authority</span>
          <div class="value-wrapper">
            <span class="status-dot" id="da-status"></span>
            <span class="metric-value font-poppins" id="da-val">--</span>
          </div>
        </div>
        <div class="metric-card">
          <span class="metric-label">Page Authority</span>
          <div class="value-wrapper">
            <span class="status-dot" id="pa-status"></span>
            <span class="metric-value font-poppins" id="pa-val">--</span>
          </div>
        </div>
        <div class="metric-card full-width">
          <span class="metric-label">Domain Rating (Ahrefs)</span>
          <div class="value-wrapper">
            <span class="status-dot" id="dr-status"></span>
            <span class="metric-value font-poppins" id="dr-val">--</span>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-enlaces">
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">Total Backlinks</span>
          <div class="value-wrapper">
            <span class="status-dot" id="backlinks-status"></span>
            <span class="metric-value font-poppins" id="backlinks-val">--</span>
          </div>
        </div>
        <div class="metric-card">
          <span class="metric-label">Ref. Domains</span>
          <div class="value-wrapper">
            <span class="status-dot" id="ref-domains-status"></span>
            <span class="metric-value font-poppins" id="ref-domains-val">--</span>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-trafico">
      <div class="metrics-grid">
        <div class="metric-card full-width">
          <span class="metric-label">Tráfico Orgánico / mes</span>
          <div class="value-wrapper">
            <span class="status-dot" id="traffic-status"></span>
            <span class="metric-value font-poppins" id="traffic-val">--</span>
          </div>
        </div>
        <div class="metric-card full-width">
          <span class="metric-label">Palabras Clave (Keywords)</span>
          <div class="value-wrapper">
            <span class="status-dot" id="keywords-status"></span>
            <span class="metric-value font-poppins" id="keywords-val">--</span>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-riesgo">
      <div class="metrics-grid">
        <div class="metric-card full-width">
          <span class="metric-label">Spam Score (Moz)</span>
          <!-- Semicírculo Dinámico -->
          <div class="gauge-container">
            <svg viewBox="0 0 100 50" class="gauge-svg">
              <!-- Fondo del medidor -->
              <path d="M 10 45 A 35 35 0 0 1 90 45" fill="none" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" />
              <!-- Progreso del medidor -->
              <path id="spam-gauge-fill" d="M 10 45 A 35 35 0 0 1 90 45" fill="none" stroke="var(--primary)" stroke-width="10" stroke-linecap="round" stroke-dasharray="110" stroke-dashoffset="110" />
            </svg>
            <div class="gauge-value font-poppins">
              <span class="status-dot" id="spam-status" style="display: none;"></span>
              <span id="spam-val">--%</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Botón Principal -->
    <button id="btn-analyze" class="btn-primary font-poppins">
      <svg class="btn-icon" id="btn-icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      <span id="btn-text">Inspeccionar Dominio</span>
    </button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
